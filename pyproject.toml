[project]
name = "healthguard"
version = "1.0.0"
description = "HealthGuard — production-grade agentic RAG assistant for US health insurance members (OpenRouter, LangGraph, Postgres/pgvector, Redis)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "redisvl>=0.4.0",
    "arq>=0.26.0",
    # Agent / LLM
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "openai>=1.50.0",
    "tiktoken>=0.8.0",
    "sqlglot>=25.0.0",
    # Security
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    # Data
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "tabulate>=0.9.0",
    "faker>=30.0.0",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "langfuse>=5.0.1",  # LLM tracing, scores and cost per observation (off unless keys are set)
    # Evaluation
    "ragas>=0.4.0",
    # ragas 0.4.x imports langchain_community.chat_models.vertexai (removed in 0.4.2)
    "langchain-community>=0.3.0,<0.4.2",
    # Frontend
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
hg-seed = "backend.data_gen.seed:main"
hg-ingest = "backend.rag.ingest:main"
hg-eval = "backend.evals.run:main"
hg-build-golden = "backend.evals.build_golden:main"
hg-models-check = "backend.scripts.models_check:main"
hg-chat = "backend.scripts.chat_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["backend/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "E501",   # line length is enforced by `ruff format`; long string literals are allowed
    "S101",   # assert is fine in tests
    "S608",   # SQL built from validated identifiers only (see sql_guard)
    "B008",   # FastAPI Depends() in defaults
    "RUF001", "RUF002", "RUF003",  # unicode in docs/prompts is intentional
    "S311",   # random is used for synthetic data, not crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "ASYNC240"]  # blocking file reads are fine in tests
"backend/core/config.py" = ["S105"]  # dev-only defaults; production guard rejects them
"backend/data_gen/**" = ["E501"]
"backend/llm/prompts/**" = ["E501"]
"backend/core/data_sources.py" = ["E501"]  # catalog strings are prompt content

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["backend/db/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires Postgres + Redis (docker compose up -d postgres redis)",
    "live: requires a real OPENROUTER_API_KEY and network access to openrouter.ai",
]
addopts = "-ra"

[tool.coverage.run]
source = ["backend", "frontend"]
omit = [
    "backend/db/migrations/*",
    "backend/scripts/*",        # CLIs exercised directly by CI (hg-models-check, hg-chat)
    "backend/data_gen/*",       # exercised by `hg-seed` in CI, verified by the data smoke tests
    "backend/rag/ingest.py",    # exercised by `hg-ingest` in CI
]

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
